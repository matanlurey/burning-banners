<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>War table · responsive browser checks</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#111b22;color:#e6e4dd;font:14px system-ui}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #456}button{background:#24343f;color:inherit;border:1px solid #647681;padding:7px 10px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#4c634e}#size{margin-left:auto}main{display:flex;justify-content:center;padding:12px}iframe{display:block;border:1px solid #71818b;background:#182329;flex-shrink:0}p{margin:0 12px 8px;font-size:11px;color:#adc0ca}</style></head>
<body><header><strong>Responsive browser checks</strong><button data-size="1280,800">Desktop</button><button data-size="390,844" aria-pressed="true">Phone 390 × 844</button><button data-size="360,740">Small phone</button><button data-size="320,568">Compact phone</button><button data-size="768,1024">Tablet</button><button data-size="844,390">Landscape</button><button data-size="736,414">Small landscape</button><span id="size">390 × 844 CSS pixels</span></header><p>The game runs in a real browser frame at the selected size. This checks responsive layout; it does not emulate physical touchscreen hardware.</p><main><iframe id="game" title="Game under test" src="/" width="390" height="844"></iframe></main>
<script>for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');const frame=document.getElementById('game');frame.width=w;frame.height=h;document.getElementById('size').textContent=w+' × '+h+' CSS pixels';for(const b of document.querySelectorAll('[data-size]'))b.setAttribute('aria-pressed',String(b===button));};</script></body></html>
